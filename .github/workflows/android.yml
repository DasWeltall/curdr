name: Android APK
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release-kind:
    runs-on: ubuntu-latest
    outputs:
      build_apk: ${{ steps.kind.outputs.build_apk }}
    steps:
      - uses: actions/checkout@v4
      - id: kind
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          curdr_app_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$RELEASE_TAG" = "v$curdr_app_version" ]; then
            echo 'build_apk=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_apk=false' >> "$GITHUB_OUTPUT"
          fi
  apk:
    needs: release-kind
    if: ${{ needs.release-kind.outputs.build_apk == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck && npm test
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Optional Firebase client configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] && [ -n "$EXPO_PROJECT_ID" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_EAS_PROJECT_ID=$EXPO_PROJECT_ID" >> "$GITHUB_ENV"
          fi
      - run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: curdr-android
          path: artifacts/*.apk
          retention-days: 30
      - name: Attach Android APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.apk --clobber
